version: '2'
services:
  vault:
    image: vault
    stdin_open: true
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=goldfish
    cap_add:
        - IPC_LOCK
    command: server -dev
  goldfish:
    build:
      context: .
      dockerfile: Dockerfile.backend
    stdin_open: true
    links:
      - vault
    depends_on:
      - vault
    command: /app/entrypoint.sh
  goldfish-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - 8080:80/tcp
    links:
      - goldfish
    depends_on:
      - goldfish
    stdin_open: true
