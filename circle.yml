dependencies:
  override:
    - go get -t -d -v ./...
    - curl -sL https://deb.nodesource.com/setup_8.x | sudo -E bash -
    - sudo apt-get install -y nodejs

test:
  override:
    - if [ "$CIRCLE_NODE_INDEX" -eq "0" ] ; then go build -v -a && go test ./... -v ; fi:
        parallel: true
    - if [ "$CIRCLE_NODE_INDEX" -eq "1" ] ; then cd frontend && sudo npm install -g cross-env && sudo npm install && sudo npm run build ; fi:
        parallel: true
