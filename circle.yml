dependencies:
  override:
    # backend
    - go get -t -d -v ./...
    # frontend
    - nvm install v7.10.0
    - sudo $(which npm) install -g cross-env
    - npm link webpack

test:
  override:
    # backend
    - if [ "$CIRCLE_NODE_INDEX" -eq "0" ] ; then go build -v -a && go test ./... -v ; fi:
        parallel: true
    # frontend
    - if [ "$CIRCLE_NODE_INDEX" -eq "1" ] ; then cd frontend && npm install && npm run build ; fi:
        parallel: true
